# fleet-install descriptor for the Desk binary. Deploy with an explicit target:
#   fleet-install deploy surface-desk --commit <sha> --target linux-basalisk [--dry-run]
# No host names here: this repository is public (scripts/scan-public).
schema: fleet-deploy/v1
app: surface-desk
repo: hollis-labs/surface
artifact: {name: "surface-desk-{sha12}", tarball: "surface-desk_{version}_{os}_{arch}.tar.gz", sums: SHA256SUMS}
targets:
  # Basalisk: the Desk instance run by the Cerberus resource `basalisk` (project surface),
  # whose command is ~/.local/bin/surface-desk.
  - id: linux-basalisk
    when: {os: linux, arch: amd64}
    binary: surface-desk
    install_root: ~/.local/share/fleet/releases/surface-desk
    symlinks:
      - path: ~/.local/bin/surface-desk
    preflight:
      - {kind: sqlite_backup, db: ~/.local/share/basalisk-desk/surface.db, dest: "{backup_dir}/basalisk-desk.pre-{version}.db"}
    restart:
      - {via: cerberus, resource: basalisk, verb: reload, run: true}
    health: {url: "http://127.0.0.1:8190/healthz", expect_status: [200], timeout: 60s}
